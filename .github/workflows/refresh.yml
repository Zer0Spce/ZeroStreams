name: Refresh live playlist
on:
  schedule:
    # UTC cron corresponds to 00:00, 04:00, 06:00, 07:00, 08:00,
    # 10:00, 12:00, 15:00, 18:00, 21:00 Philippine Time (UTC+8).
    - cron: '0 0,2,4,7,10,13,16,20,22,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playlist-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Generate playlist
        run: python scraper.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-diagnostics
          path: |
            status.json
            ppv-catalog.json
          retention-days: 7
      - name: Commit playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u status.json ppv-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh live playlist'
            git push
          fi
