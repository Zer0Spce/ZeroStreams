# Independent GitHub Actions schedule registration for ZeroStreams.
# This invokes the same tested refresh job as refresh.yml and adds no
# external service, token, or scheduler account.
name: Backup automatic playlist refresh

on:
  schedule:
    # Staggered slots, separate from refresh.yml's 04/09/14/... slots.
    - cron: '2-59/10 * * * *'
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
  # Exercise the reusable job when this watchdog is first installed/changed.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-watchdog.yml'

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh.yml
    permissions:
      actions: read
      contents: write
